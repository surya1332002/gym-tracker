[build]
  command = "npm run build"
  publish = "dist"

# Applies only to develop. The existing main/production build stays unchanged.
[context.develop]
  command = "npm run build:develop-preview"

[context.develop.environment]
  NODE_VERSION = "22"

# SPA fallback (serve index.html for any path)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Make SW updates predictable (don’t cache the file itself)
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/build-info.json"
  [headers.values]
    Cache-Control = "no-cache"
