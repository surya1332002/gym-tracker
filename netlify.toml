[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback (serve index.html for any path)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Make SW updates predictable (don’t cache the file itself)
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
